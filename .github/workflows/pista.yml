name: Pista (testes e build)

on:
  push:
    paths: ["dj-studio/**", ".github/workflows/pista.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dj-studio/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dj-studio/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Pista
          path: dj-studio/app/dist/index.html

  stems-modelo-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dj-studio/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dj-studio/app/package-lock.json
      - name: Cache do modelo HTDemucs
        uses: actions/cache@v4
        with:
          path: ~/htdemucs
          key: htdemucs-embedded-v1
      - name: Baixar modelo (172 MB, só na 1ª vez)
        run: |
          mkdir -p ~/htdemucs
          [ -f ~/htdemucs/htdemucs_embedded.onnx ] || curl -fL --retry 3 -o ~/htdemucs/htdemucs_embedded.onnx https://huggingface.co/timcsy/demucs-web-onnx/resolve/main/htdemucs_embedded.onnx
          ls -la ~/htdemucs
      - run: npm ci
      - run: npm install --no-save onnxruntime-node@1.31.1
      - name: Separar uma música demo com o modelo real
        run: STEMS_MODEL=$HOME/htdemucs/htdemucs_embedded.onnx npx vitest run src/audio/stems.model.test.ts --reporter verbose
